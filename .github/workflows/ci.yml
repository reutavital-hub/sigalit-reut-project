name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. משיכת הקוד
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. התקנת Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. בדיקות צד שרת (14 בדיקות Jest + Prisma)
      - name: Test Server
        working-directory: ./server
        env:
          JWT_SECRET: "test-jwt-secret-key-for-testing"
        run: |
          npm ci
          npx prisma generate
          npm test --if-present

      # 4. בדיקת בנייה של צד לקוח (Vite Build)
      - name: Build Client
        working-directory: ./client
        run: |
          npm ci
          npm run build