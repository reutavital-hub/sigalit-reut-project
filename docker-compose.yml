services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: bakery-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
    volumes:
      - ./server/logs:/app/server/logs

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: bakery-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://server:5000
    depends_on:
      - server